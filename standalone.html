        // 搜索功能
        function searchKnowledge(query) {
            const keywords = query.toLowerCase().split(/\s+/).filter(k => k.length > 1);
            if (keywords.length === 0) return [];

            return knowledgeData.filter(record => {
                const searchText = (
                    record.异常描述 +
                    record.异常分类 +
                    record.模块 +
                    record.根本原因 +
                    record.临时措施 +
                    record.永久措施
                ).toLowerCase();

                return keywords.some(keyword => searchText.includes(keyword));
            });
        }

        // 格式化回复
        function formatReply(query, results) {

                return `🔍 **未找到匹配结果**

抱歉，知识库中暂无与"**${query}**"相关的故障记录。

• 尝试更简化的关键词（如"加样臂"、"抓手"、"泵盒"）
• 使用模块名称搜索（如"试剂仓"、"盖玻片"）
• 联系砖家获取支持

📊 **当前知识库统计**：
• 故障记录：50+ 条
• 覆盖模块：12 个
• 故障分类：50+ 种`;
            }

            let reply = `🔍 **故障查询结果**\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;

            if (mainResult.异常分类) {
                reply += `📋 **【问题分类】**\n${mainResult.异常分类}\n\n`;
            }
            if (mainResult.模块) {
                reply += `📦 **【涉及模块】**\n${mainResult.模块}\n\n`;
            }
            if (mainResult.根本原因) {
                reply += `🔍 **【根本原因】**\n${mainResult.根本原因}\n\n`;
            }

            reply += `🔧 **【处理措施】**\n`;
            if (mainResult.临时措施) {
                reply += `• 临时：${mainResult.临时措施}\n`;
            }
            if (mainResult.永久措施) {
                reply += `• 永久：${mainResult.永久措施}\n`;
            }
            if (!mainResult.临时措施 && !mainResult.永久措施) {
                reply += `暂无记录\n`;
            }
            reply += '\n';

            if (mainResult.责任部门) {
                reply += `🏢 **【责任部门】** ${mainResult.责任部门}\n\n`;
            }

            if (results.length > 1) {
                reply += `📚 **【相关记录】**（共${results.length}条）\n`;
                results.slice(1, 4).forEach((r, i) => {
                    const desc = r.异常描述?.substring(0, 40) || '无描述';
                    reply += `${i + 1}. ${desc}${desc.length >= 40 ? '...' : ''}\n`;
                });
                if (results.length > 4) {
                    reply += `   ...还有 ${results.length - 4} 条\n`;
                }
                reply += '\n';
            }

            reply += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n💡 如需进一步帮助，请联系砖家（IVD技术专家）`;

            return reply;

        // 添加消息
        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = content.replace(/\n/g, '<br>');

            const time = document.createElement('div');
            time.className = 'message-time';
            const now = new Date();
            time.textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            messageDiv.appendChild(bubble);
            messageDiv.appendChild(time);
            document.getElementById('chatContainer').appendChild(messageDiv);
            document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
        }

        // 快速提问
        function quickAsk(question) {
            document.getElementById('questionInput').value = question;
            sendQuestion();
        }

        // 发送问题
        function sendQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) return;

            addMessage(question, true);
            document.getElementById('questionInput').value = '';
            document.getElementById('sendBtn').disabled = true;

            // 模拟延迟
            setTimeout(() => {
                const results = searchKnowledge(question);
                const answer = formatReply(question, results);
                addMessage(answer, false);
                document.getElementById('sendBtn').disabled = false;
            }, 300);
        }

        // 事件监听
        document.getElementById('sendBtn').addEventListener('click', sendQuestion);
        document.getElementById('questionInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendQuestion();
            }
        });

        // 初始化
        console.log('IVD知识助手已加载，知识库记录：', knowledgeData.length);
